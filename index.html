
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click tỉnh táo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fb;color:#172033}
main{max-width:720px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0000000c}
h1{color:#2349a6;margin-bottom:8px}
.muted{color:#657087;line-height:1.6}
button{cursor:pointer;border:0;border-radius:10px;padding:13px 17px;font-size:15px}
.primary{background:#2349a6;color:white;width:100%;margin-top:15px}
.option{display:block;width:100%;text-align:left;background:#f0f3fa;margin:10px 0}
.option:hover{background:#dce7ff}
.option:disabled{cursor:default;opacity:1}
#feedback{margin-top:18px;padding:15px;background:#edf5ff;border-radius:10px;line-height:1.6}
.hidden{display:none}
.bar{height:8px;background:#e4e8f1;border-radius:9px;overflow:hidden}
#progress{height:100%;background:#3564d4;width:0}
</style>
</head>
<body>
<main>
<section class="card">
  <h1>🛡️ Click tỉnh táo</h1>
  <p class="muted">Trò chơi giúp học sinh THPT nhận diện dấu hiệu lừa đảo trực tuyến.</p>
  <div id="intro">
    <p>Hãy đọc tình huống, chọn cách xử lý an toàn và tìm hiểu vì sao.</p>
    <p class="muted">Đây là tình huống giả lập phục vụ giáo dục.</p>
    <button class="primary" onclick="startGame()">Bắt đầu chơi</button>
  </div>
  <div id="game" class="hidden">
    <p id="counter" class="muted"></p>
    <div class="bar"><div id="progress"></div></div>
    <h2 id="question"></h2>
    <p id="scenario" class="muted"></p>
    <div id="options"></div>
    <div id="feedback" class="hidden" aria-live="polite"></div>
    <button id="next" class="primary hidden" onclick="nextQuestion()">Câu tiếp theo</button>
  </div>
  <div id="result" class="hidden">
    <h2>Hoàn thành!</h2>
    <h3 id="score"></h3>
    <p id="summary" class="muted"></p>
    <button class="primary" onclick="startGame()">Chơi lại</button>
  </div>
</section>
</main>
<script>
const questions = [
{
title:"Tin nhắn trúng thưởng",
scenario:"Một tin nhắn báo bạn trúng thưởng lớn và phải bấm vào đường dẫn trong 10 phút để nhận quà.",
options:[
"Bấm ngay để không mất phần thưởng",
"Không bấm; tự kiểm tra chương trình qua kênh chính thức",
"Nhập thông tin cá nhân để kiểm tra",
"Chuyển tiếp tin nhắn cho nhiều người"
],
answer:1,
why:"Phần thưởng bất ngờ và thời hạn gấp có thể tạo áp lực tâm lý. Không bấm đường dẫn chưa xác minh. Hãy tự tìm kênh chính thức của đơn vị được nhắc đến."
},
{
title:"Tuyển dụng việc nhẹ lương cao",
scenario:"Một tài khoản lạ hứa trả lương cao cho công việc đơn giản, nhưng yêu cầu bạn chuyển tiền trước để kích hoạt hồ sơ.",
options:[
"Chuyển một khoản nhỏ để thử",
"Gửi ảnh căn cước để xác minh",
"Không chuyển tiền; kiểm tra công ty và thông tin tuyển dụng",
"Nhờ bạn bè chuyển hộ"
],
answer:2,
why:"Yêu cầu nộp tiền trước để được nhận việc là dấu hiệu cảnh báo. Cần xác minh công ty qua nguồn độc lập và không gửi giấy tờ tùy thân cho tài khoản chưa đáng tin."
},
{
title:"Yêu cầu cung cấp OTP",
scenario:"Người tự xưng là nhân viên ngân hàng gọi điện, nói tài khoản có vấn đề và yêu cầu đọc mã OTP.",
options:[
"Đọc OTP nếu người gọi biết tên mình",
"Không cung cấp OTP; ngắt cuộc gọi và liên hệ ngân hàng qua kênh chính thức",
"Gửi ảnh màn hình tin nhắn OTP",
"Đọc OTP nhưng đổi mật khẩu sau đó"
],
answer:1,
why:"Không cung cấp OTP, mật khẩu hoặc mã xác thực cho người gọi. Hãy tự liên hệ ngân hàng bằng số điện thoại trên thẻ hoặc website chính thức."
},
{
title:"Bạn bè nhờ chuyển tiền",
scenario:"Tài khoản mạng xã hội của bạn thân nhắn rằng đang gặp việc gấp và cần bạn chuyển tiền ngay. Tài khoản từ chối gọi điện.",
options:[
"Chuyển tiền ngay vì là bạn thân",
"Đăng công khai số tài khoản của bạn ấy",
"Xác minh qua một kênh khác hoặc liên hệ trực tiếp với bạn",
"Yêu cầu gửi thêm thông tin cá nhân"
],
answer:2,
why:"Tài khoản có thể bị chiếm đoạt. Hãy xác minh danh tính bằng cuộc gọi hoặc một kênh liên lạc độc lập trước khi chuyển tiền."
}
];

let index=0, points=0, locked=false;

function startGame(){
 index=0;points=0;locked=false;
 document.getElementById("intro").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 render();
}

function render(){
 locked=false;
 const q=questions[index];
 document.getElementById("counter").textContent=
   `Câu ${index+1}/${questions.length}`;
 document.getElementById("progress").style.width=
   `${index/questions.length*100}%`;
 document.getElementById("question").textContent=q.title;
 document.getElementById("scenario").textContent=q.scenario;
 document.getElementById("feedback").classList.add("hidden");
 document.getElementById("next").classList.add("hidden");
 const area=document.getElementById("options");
 area.innerHTML="";
 q.options.forEach((option,i)=>{
   const button=document.createElement("button");
   button.className="option";
   button.textContent=String.fromCharCode(65+i)+". "+option;
   button.onclick=()=>choose(i);
   area.appendChild(button);
 });
}

function choose(choice){
 if(locked)return;
 locked=true;
 const q=questions[index];
 const buttons=document.querySelectorAll(".option");
 buttons.forEach((b,i)=>b.disabled=true);
 const correct=choice===q.answer;
 if(correct)points++;
 buttons[q.answer].style.background="#d8f5e2";
 if(!correct)buttons[choice].style.background="#ffe1e1";
 const feedback=document.getElementById("feedback");
 feedback.textContent=(correct?"Chính xác! ":"Chưa chính xác. ")
   +q.why;
 feedback.classList.remove("hidden");
 const next=document.getElementById("next");
 next.textContent=index===questions.length-1?"Xem kết quả":"Câu tiếp theo";
 next.classList.remove("hidden");
}

function nextQuestion(){
 index++;
 if(index<questions.length){render();return;}
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("progress").style.width="100%";
 document.getElementById("score").textContent=
   `Điểm số: ${points}/${questions.length}`;
 document.getElementById("summary").textContent=
   points===questions.length
   ?"Bạn đã chọn đúng tất cả câu trong lượt chơi này. Hãy tiếp tục cảnh giác với các tình huống mới."
   :"Hãy đọc lại lời giải thích và thử chơi lần nữa. Trong thực tế, hãy xác minh thông tin trước khi hành động.";
}
</script>
</body>
</html>
